---
layout: default
---
<section class="page-head">
  <h1 class="display">{{ page.title }}</h1>
  <div class="page-intro">{{ content }}</div>
</section>
<section class="band">
  <ul class="post-list">
    {% for post in site.posts %}{% if post.draft != true %}
    <li>
      <span class="post-list-date">{{ post.date | date: "%b %-d, %Y" }}</span>
      <a class="post-list-title" href="{{ post.url | replace:".html","" | prepend: site.baseurl }}">{{ post.title }}</a>
    </li>
    {% endif %}{% endfor %}
  </ul>
</section>
