<article class="fragment">
  <div class="fragment-media{% if include.item.zoom %} is-zoom{% endif %}">
    <img src="{{ include.item.image | absolute_url }}" alt="{{ include.item.title }}" loading="lazy" />
  </div>
  <h3 class="fragment-title">{{ include.item.title }}</h3>
  <p class="fragment-authors">{{ include.item.authors }}</p>
  <p class="fragment-venue">{{ include.item.venue }}</p>
  <div class="fragment-foot">
    <span class="fragment-year">{{ include.item.venue | slice: -4, 4 }}</span>
    {% if include.item.links %}
    <span class="fragment-links">
      {% for link in include.item.links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.label }}</a>{% endfor %}
    </span>
    {% endif %}
  </div>
</article>
